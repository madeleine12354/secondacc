name: Run every 2 hours

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_TOKEN: ${{ secrets.MAIN_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files (debug)
        run: |
          pwd
          ls -R

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests loguru python-dotenv

      - name: Check secrets
        run: |
          if [ -z "$MAIN_TOKEN" ] || [ -z "$BOT_TOKEN" ]; then
            echo "Missing MAIN_TOKEN or BOT_TOKEN"
            exit 1
          fi

      - name: Run script (dynamic path)
        run: |
          echo "Current working dir: $(pwd)"
          echo "Looking for main.py..."
          find . -type f -path '*FarmWinsAlmaz-durakonline-main/main.py' -print
          MAIN_PY=$(find . -type f -path '*FarmWinsAlmaz-durakonline-main/main.py' | head -n 1)
          if [ -z "$MAIN_PY" ]; then
            echo "main.py not found"
            find . -maxdepth 6 -type f -name 'main.py' -print
            exit 1
          fi
          echo "Executing $MAIN_PY"
          python "$MAIN_PY"
